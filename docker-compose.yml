services:
  frontend:
    image: node:20-alpine
    working_dir: /app
    environment:
      VITE_PROXY_TARGET: http://backend:9230
      HUSKY: '0'
    volumes:
      - ./:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - '9229:9229'
    command: >-
      sh -c "npm install --no-audit --no-fund && npx --yes wait-on@7.2.0 http://backend:9230/api/health && npm run dev"
    depends_on:
      - backend

  backend:
    image: node:20-alpine
    working_dir: /app
    environment:
      PORT: '9230'
      HUSKY: '0'
    volumes:
      - ./:/app
      - backend_node_modules:/app/node_modules
    ports:
      - '9230:9230'
    command: >-
      sh -c "npm install --no-audit --no-fund && npx --yes nodemon --watch server/index.js --watch server/ --watch .env --ignore logs --ignore server/logs --ext js,json server/index.js"

volumes:
  frontend_node_modules:
  backend_node_modules:
