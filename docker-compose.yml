services:
  frontend:
    image: node:24-alpine
    working_dir: /app
    environment:
      VITE_PROXY_TARGET: http://backend:9230
    volumes:
      - ./:/app
      - /app/node_modules
    ports:
      - "9229:9229"
    command: >-
      sh -c "npm install --no-audit --no-fund && npm run dev"
    depends_on:
      - backend

  backend:
    image: node:24-alpine
    working_dir: /app
    environment:
      PORT: "9230"
    volumes:
      - ./:/app:rw
      - /app/node_modules
    ports:
      - "9230:9230"
    command: >-
      sh -c "npm install --no-audit --no-fund && npx --yes prisma generate && npx --yes nodemon --watch server.js --watch services/ --watch .env --ext js,json server.js"
