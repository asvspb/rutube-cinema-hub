services:
  frontend:
    image: node:20-alpine
    working_dir: /app
    environment:
      VITE_PROXY_TARGET: http://backend:9230
      HUSKY: '0'
    volumes:
      - ./:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - '9229:9229'
    command: >-
      sh -c "npm install --no-audit --no-fund && npx --yes wait-on@7.2.0 http://backend:9230/api/health && npm run dev"
    depends_on:
      - backend
    dns:
      - 8.8.8.8
      - 1.1.1.1

  backend:
    image: node:20-alpine
    working_dir: /app
    environment:
      PORT: '9230'
      HUSKY: '0'
      NODE_OPTIONS: '--max-old-space-size=512'
      PROXY_CONNECT_TIMEOUT_MS: '30000'
      PROXY_REQUEST_TIMEOUT_MS: '60000'
      PROXY_RATE_LIMIT_MAX_REQUESTS: '1000'
      PROXY_RATE_LIMIT_WINDOW_MS: '60000'
    volumes:
      - ./:/app
      - backend_node_modules:/app/node_modules
    ports:
      - '9230:9230'
    command: >-
      sh -c "apk add --no-cache ca-certificates && update-ca-certificates && npm install --no-audit --no-fund && npx --yes nodemon --watch server/index.js --watch server/ --watch .env --ignore logs --ignore server/logs --ext js,json server/index.js"
    dns:
      - 8.8.8.8
      - 1.1.1.1

volumes:
  frontend_node_modules:
  backend_node_modules:
